name: Build APK

# Builds a signed release APK of this fork on every push to main (and on demand).
# Download it from the run's "Artifacts" section, or from the "latest-apk" release.
#
# Signing uses a fixed key kept in repository secrets, so every build installs as an
# update over the previous one:
#   SIGNING_KEYSTORE_BASE64  base64 of the .jks file
#   SIGNING_STORE_PASSWORD   keystore password
#   SIGNING_KEY_ALIAS        key alias
#   SIGNING_KEY_PASSWORD     key password

on:
  push:
    branches: [main, 'fork/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Automation engine tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --tests '*AutomationEngineSteeringKeyTest*' --tests '*AutomationEngineButtonPressTest*' --tests '*CampingCommandsTest*' --stacktrace

      - name: Assemble release
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYDMate-fork-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish latest-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk app/build/outputs/apk/release/*.apk \
            --title "Latest fork build (${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_SHA}." --prerelease
